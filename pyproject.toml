[project]
name = "nuke-assistant-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants control and build content in Foundry Nuke"
readme = "README.md"
requires-python = ">=3.10"
# None: the server speaks MCP itself (src/nuke_mcp/mcp_lite.py) and runs on Nuke's Python.
dependencies = []

[project.scripts]
nuke-mcp = "nuke_mcp.server:main"

[dependency-groups]
# The MCP SDK is only used by the tests, as an independent client.
dev = ["pytest>=8", "mcp>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuke_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
