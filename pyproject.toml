[project]
name = "nuke-assistant-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants control and build content in Foundry Nuke"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9",
]

[project.scripts]
nuke-mcp = "nuke_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuke_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
